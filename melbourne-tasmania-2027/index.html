.chip.city{ color:var(--cc); }

.toast{ position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:50; background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:999px; font-size:13.5px; box-shadow:var(--shadow); white-space:nowrap; }

function useSynced(key, docId, init, merge){
  const [v, setV] = usePersist(key, init);
  const cur = useRef(v); cur.current = v;

  const lastSent = useRef(null), busy = useRef(false), again = useRef(false), timer = useRef(null);
  const push = useCallback(async () => {
    if (!ref.current || SYNC.state === 'readonly') return;
    if (busy.current) { again.current = true; return; }
    busy.current = true;
    do {
      again.current = false;
      const json = JSON.stringify(cur.current === undefined ? null : cur.current);
      if (json === lastSent.current) continue;
      const prev = lastSent.current;
      lastSent.current = json;
      try { await ref.current.set({ json, at: Date.now() }); if (SYNC.state === 'error') setSync('synced'); }
      catch(e){ lastSent.current = prev; setSync(e && (e.code === 'invalid_argument' || e.code === 'not_granted') ? 'readonly' : 'error'); }
    } while (again.current);
    busy.current = false;
  }, []);
  useEffect(() => {
    let unsub = null, dead = false;
    getDb().then(db => {
      if (!db || dead) return;
      try { ref.current = db.doc('plan/' + docId); } catch(e){ return; }
      unsub = ref.current.onSnapshot(snap => {
        if (snap.metadata && snap.metadata.hasPendingWrites) return;
        const first = !ready.current;
        ready.current = true;
        if (!snap.exists) { if (first && !isBlank(cur.current) && JSON.stringify(cur.current) !== JSON.stringify(init)) push(); return; }
        const body = snap.data() || {};
        const json = typeof body.json === 'string' ? body.json : 'null';
        if (json === lastSent.current) return;
        let rv; try { rv = JSON.parse(json); } catch(e){ return; }
        lastSent.current = json;
        const next = first && merge ? merge(cur.current, rv) : rv;
        const nextJson = JSON.stringify(next);
        if (nextJson !== JSON.stringify(cur.current)) { fromRemote.current = true; cur.current = next; setV(next); }
        if (first && merge && nextJson !== JSON.stringify(rv)) setTimeout(push, 0);
      }, e => { setSync(e && e.code === 'invalid_argument' ? 'readonly' : 'error'); });
    });
    return () => { dead = true; if (unsub) unsub(); clearTimeout(timer.current); };
  }, []);
  useEffect(() => {
    if (fromRemote.current) { fromRemote.current = false; return; }
    if (!ready.current || !ref.current) return;
    clearTimeout(timer.current);
    timer.current = setTimeout(push, 700);

}

/* ---------- next up ---------- */
const atTime = (d, t) => { const [y,m,dd] = d.split('-').map(Number); const [h,mi] = (t || '00:00').split(':').map(Number); return new Date(y, m-1, dd, h || 0, mi || 0); };
function findNext(done, now){
  const items = ALL_ACTS.map(a => { const d = a.date || a.day.date, st = atTime(d, a.start); let en = atTime(d, a.end || a.start); if (en <= st) en = new Date(st.getTime() + 30 * 6e4); return { a, st, en }; }).sort((x, y) => x.st - y.st);
  const cur = items.find(x => x.st <= now && now < x.en && !done[x.a.id]) || null;
  const nxt = items.find(x => x.st > now && !done[x.a.id] && (!cur || x.a.id !== cur.a.id)) || null;
  return { cur, nxt };
}
const until = (ms) => { const m = Math.round(ms / 6e4); if (m < 1) return 'now'; if (m < 60) return 'in ' + m + ' min'; const h = Math.floor(m / 60), r = m % 60; if (h < 24) return 'in ' + h + ' h' + (r ? ' ' + r + ' min' : ''); const d = Math.round(ms / 864e5); return 'in ' + d + (d === 1 ? ' day' : ' days'); };
function NextUp({ done, toggleDone, onGo }){
  const [now, setNow] = useState(() => new Date());
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 30000); return () => clearInterval(t); }, []);
  const { cur, nxt } = findNext(done, now);
  if (!cur && !nxt) return null;
  const Nav = I('Navigation'), Check = I('Check'), Clock = I('Clock');
  const Row = ({ x, kind }) => { const a = x.a, q = placeQueries(a, a.day)[0]; const left = kind === 'now' ? Math.round((x.en - now) / 6e4) : null;
    return html`<div style=${{ ...cityVars(a.day.city), padding:'14px 16px', borderLeft:'4px solid var(--cc)', borderTop: kind === 'next' && cur ? '1px solid var(--line)' : 0 }}>
      <div class="flex items-center justify-between gap-2">
        <span style=${{ fontSize:11.5, fontWeight:700, letterSpacing:'.08em', textTransform:'uppercase', color: kind === 'now' ? 'var(--sakura)' : 'var(--ink3)' }}>${kind === 'now' ? 'Happening now' : 'Next up'}</span>
        <span class="faint flex items-center gap-1" style=${{ fontSize:12.5 }}><${Clock} size=${13} />${kind === 'now' ? (left >= 60 ? 'ends ' + a.end : left + ' min left') : until(x.st - now)}</span>
      </div>
      <button onClick=${() => onGo(a.day.n)} class="text-left" style=${{ background:'none', border:0, padding:0, marginTop:6, cursor:'pointer', color:'var(--ink)', display:'block', width:'100%' }}>
        <div class="serif" style=${{ fontSize:18, fontWeight:700, lineHeight:1.3 }}>${a.title}</div>
        <div class="muted" style=${{ fontSize:13, marginTop:3 }}>${fmt(a.date || a.day.date)} · ${a.start}–${a.end} · Day ${a.day.n}${a.day.city ? ', ' + a.day.city : ''}</div>
      </button>
      <div class="flex gap-2" style=${{ marginTop:10 }}>
        ${q && html`<a class="btn primary" style=${{ padding:'7px 12px', fontSize:13 }} href=${mapsUrl(q)} target="_blank" rel="noopener"><${Nav} size=${14} />Directions</a>`}
        <button class="btn" style=${{ padding:'7px 12px', fontSize:13 }} onClick=${() => toggleDone(a.id)}><${Check} size=${14} />Done</button>
      </div>
    </div>`; };
  return html`<div class="surface" style=${{ marginTop:16, overflow:'hidden' }} aria-live="polite">${cur && html`<${Row} x=${cur} kind="now" />`}${nxt && html`<${Row} x=${nxt} kind="next" />`}</div>`;
}

/* ---------- generic list editor ---------- */
function ListEditor({ title, fields, item, onSave, onDelete, onClose }){
  const [f, setF] = useState(() => { const o = {}; fields.forEach(x => { o[x.k] = item && item[x.k] != null ? String(item[x.k]) : (x.def || ''); }); return o; });
  const set = (k) => (e) => setF(x => ({ ...x, [k]: e.target.value }));
  const valid = fields.filter(x => x.req).every(x => String(f[x.k] || '').trim());
  const rows = []; let pair = [];
  fields.forEach(x => { if (x.half) { pair.push(x); if (pair.length === 2) { rows.push(pair); pair = []; } } else { if (pair.length) { rows.push(pair); pair = []; } rows.push([x]); } });
  if (pair.length) rows.push(pair);
  const input = (x) => x.type === 'select' ? html`<select value=${f[x.k]} onChange=${set(x.k)}>${x.opts.map(([v, l]) => html`<option key=${v} value=${v}>${l}</option>`)}</select>`
    : x.type === 'area' ? html`<textarea rows="3" value=${f[x.k]} onInput=${set(x.k)} placeholder=${x.ph || ''}></textarea>`
    : html`<input type=${x.type || 'text'} value=${f[x.k]} onInput=${set(x.k)} placeholder=${x.ph || ''} />`;
  return html`<${Sheet} title=${title} onClose=${onClose}>
    ${rows.map((r, i) => r.length === 2 ? html`<div key=${i} class="grid grid-cols-2 gap-3">${r.map(x => html`<${Field} key=${x.k} label=${x.l}>${input(x)}<//>`)}</div>` : html`<${Field} key=${r[0].k} label=${r[0].l}>${input(r[0])}<//>`)}
    <div class="flex gap-2" style=${{ marginTop:18 }}>
      ${item && html`<button class="btn" style=${{ color:'var(--momiji)' }} onClick=${() => { if (confirm('Delete this?')) onDelete(item.id); }}>Delete</button>`}
      <button class="btn primary" style=${{ flex:1, opacity: valid ? 1 : .5 }} disabled=${!valid} onClick=${() => { const o = { id:(item && item.id) || ('i' + Date.now().toString(36)) }; fields.forEach(x => { o[x.k] = String(f[x.k] || '').trim(); }); onSave(o); }}>${item ? 'Save' : 'Add'}</button>
    </div>
  <//>`;
}
const useListSheet = (setList, toast, noun) => {
  const [sheet, setSheet] = useState(null);
  const close = useCallback(() => setSheet(null), []);
  const save = (o) => { setList(l => { const has = (l || []).some(x => x.id === o.id); return has ? l.map(x => x.id === o.id ? { ...x, ...o } : x) : [...(l || []), o]; }); toast(sheet && sheet.item ? noun + ' updated' : noun + ' added'); setSheet(null); };
  const del = (id) => { setList(l => (l || []).filter(x => x.id !== id)); toast(noun + ' deleted'); setSheet(null); };
  return { sheet, setSheet, close, save, del };
};

        <div><div class="serif" style=${{ fontSize:20, fontWeight:700 }}>${next.title}</div><div class="muted" style=${{ fontSize:13.5 }}>Book by ${fmt(next.deadline)}${next.via ? ' · ' + next.via : ''}</div></div>

}

const PACK_N = PACK.reduce((n, g) => n + g.items.length, 0);
function Packing({ pack, setPack }){
  const Check = I('Check'), Plus = I('Plus'), Trash = I('Trash');

  const add = () => { const t = txt.trim(); if (!t) return; setPack(p => ({ ...p, custom: [...(p.custom || []), { id:'c' + Date.now().toString(36), t }] })); setTxt(''); };
  const del = (id) => setPack(p => { const c = { ...(p.checked || {}) }; delete c[id]; return { checked:c, custom:(p.custom || []).filter(x => x.id !== id) }; });
  const total = PACK_N + custom.length;

    <dl class="kv" style=${{ margin:'8px 0 0' }}>${list.map(e => html`<div key=${e.id} class="flex justify-between items-center gap-2" style=${{ marginTop:8 }}>
      <dt style=${{ marginTop:0 }}>${e.label}</dt>
      <dd class="flex items-center gap-2"><a href=${'tel:' + e.num.replace(/[^\d+]/g, '')} style=${{ fontWeight:700 }}>${e.num}</a><button class="faint" style=${{ background:'none', border:0, padding:2, cursor:'pointer' }} onClick=${() => L.setSheet({ item:e })} aria-label=${'Edit ' + e.label}><${Pencil} size=${13} /></button></dd>
    </div>`)}</dl>
    <button class="btn w-full" style=${{ marginTop:12 }} onClick=${() => L.setSheet({ item:null })}><${Plus} size=${16} />Add a number</button>
    <${AnimatePresence}>${L.sheet && html`<${ListEditor} key="em" title=${L.sheet.item ? 'Edit number' : 'Add a number'} fields=${EM_FIELDS} item=${L.sheet.item} onSave=${L.save} onDelete=${L.del} onClose=${L.close} />`}<//>
  </div>`;
}

/* ---------- utilities ---------- */
function Utilities({ setup, setSetup, onSetup, done, notes, bookings, hotels, toast, onReset, phrases, setPhrases, pack, setPack, spend, setSpend }){
  const Sheet_ = I('FileSpreadsheet'), Dl = I('Download'), Cal = I('CalendarDays'), Reset = I('RotateCcw'), Plane = I('Plane'), Pencil = I('Pencil');
  const rows = () => [['Day','Date','City','Area','Stay','Start','End','Plan','Details','Food note','Tags','Done','Day notes'],
    ...ALL_ACTS.map(a => [a.day.n, a.date || a.day.date, a.day.city, a.day.area, a.day.stay, a.start, a.end, a.title, a.desc, a.note || '', (a.tags || []).filter(t => TAG_LABEL[t]).map(t => TAG_LABEL[t]).join('; '), done[a.id] ? 'Yes' : '', notes[a.day.n] || ''])];
  const slug = (setup.name || 'trip').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'trip';
  const exportCSV = async () => { const csv = '\uFEFF' + toCSV(rows()); const r = await saveFile(slug + '-itinerary.csv', csv, csv); toast(r === 'saved' ? 'Saved CSV' : r === 'copied' ? 'Download unavailable — CSV copied' : r === 'declined' ? 'Download cancelled' : 'Could not export'); };
  const exportXLSX = async () => {
    if (!window.XLSX) { toast('Excel library did not load — use CSV instead'); return; }
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows()), 'Itinerary');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Booking','Via','Ref','For date','Book by','Status','Notes'], ...(bookings || []).map(b => [b.title, b.via, b.ref, b.date, b.deadline, STATUS[effStatus(b).s], b.note])]), 'Bookings');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Hotel','City','Check-in','Check-out','Address','Phone','Ref','Notes'], ...(hotels || []).map(h => [h.name, h.city, h.checkIn, h.checkOut, h.address, h.phone, h.ref, h.note])]), 'Hotels');
    if (spend && spend.length) XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Date','What','Category','Amount (' + (setup.localCur || 'local') + ')'], ...spend.map(x => [x.date, x.desc, SPEND_LABEL[x.cat] || x.cat, x.amt])]), 'Spending');
    const buf = XLSX.write(wb, { bookType:'xlsx', type:'array' });
    const r = await saveFile(slug + '.xlsx', new Blob([buf]), null);
    toast(r === 'saved' ? 'Saved Excel file' : r === 'declined' ? 'Download cancelled' : 'Download unavailable here — try CSV');
  };
  const exportGCal = async () => {
    const usDate = (s) => { const [y,m,d] = s.split('-'); return `${m}/${d}/${y}`; };
    const ampm = (t) => { let [h,m] = t.split(':').map(Number); const p = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${String(m).padStart(2,'0')} ${p}`; };
    const csv = toCSV([['Subject','Start Date','Start Time','End Date','End Time','All Day Event','Description','Location','Private'], ...ALL_ACTS.map(a => [a.title, usDate(a.date || a.day.date), ampm(a.start), usDate(a.date || a.day.date), ampm(a.end), 'False', a.desc + (a.note ? '\n' + a.note : ''), placeQueries(a, a.day)[0] || [a.day.area, a.day.city, setup.dest].filter(Boolean).join(', '), 'True'])]);
    const r = await saveFile(slug + '-google-calendar.csv', csv, csv);
    toast(r === 'saved' ? 'Saved — import it at calendar.google.com' : r === 'copied' ? 'Download unavailable — CSV copied' : r === 'declined' ? 'Download cancelled' : 'Could not export');
  };
  const Card = ({ icon, title, body, children }) => html`<div class="surface" style=${{ padding:18, marginBottom:12 }}>
    <div class="flex items-center gap-2" style=${{ fontWeight:700 }}><${icon} size=${18} />${title}</div>
    ${body && html`<p class="muted" style=${{ fontSize:13.5, margin:'6px 0 0' }}>${body}</p>`}
    <div style=${{ marginTop:14 }}>${children}</div></div>`;
  return html`<section aria-labelledby="ut-h">
    <h2 id="ut-h" class="serif flex items-center gap-3" style=${{ fontSize:22, fontWeight:700, margin:'28px 0 14px' }}><${SectionIcon} name="Wrench" />Utilities</h2>
    <${Card} icon=${Plane} title="Trip setup" body=${setup.name ? [setup.name, setup.dest, hasDates() ? fmt(setup.start) + ' · ' + setup.nDays + ' days' : '', setup.cities.join(' → ')].filter(Boolean).join(' · ') : 'Name, dates, cities, currencies and phrasebook language.'}>
      <button class="btn w-full" onClick=${onSetup}><${Pencil} size=${15} />${setup.name ? 'Edit trip setup' : 'Set up the trip'}</button>
    <//>
    <${SyncCard} />
    <${Phrasebook} phrases=${phrases} setPhrases=${setPhrases} toast=${toast} />
    <${Money} spend=${spend} setSpend=${setSpend} toast=${toast} onSetup=${onSetup} />
    <${Packing} pack=${pack} setPack=${setPack} />
    <${Card} icon=${Sheet_} title="Export" body="Itinerary, bookings, hotels and spending.">
      <div class="grid grid-cols-2 gap-2">
        <button class="btn primary" onClick=${exportXLSX}><${Dl} size=${16} />Excel (.xlsx)</button>
        <button class="btn" onClick=${exportCSV}><${Dl} size=${16} />CSV</button>
      </div>
      <button class="btn w-full" style=${{ marginTop:8 }} onClick=${exportGCal}><${Cal} size=${16} />Google Calendar file</button>
    <//>
    <${Emergency} setup=${setup} setSetup=${setSetup} toast=${toast} />
    <${Card} icon=${Reset} title="Clear progress" body="Clears check-offs, day notes, packing ticks and spending. Plans, bookings and hotels stay. If sync is on, this also clears them for your partner.">
      <button class="btn w-full" style=${{ color:'var(--momiji)' }} onClick=${() => { if (confirm('Clear check-offs, notes, packing ticks and spending?')) onReset(); }}><${Reset} size=${16} />Clear progress</button>
    <//>
  </section>`;
}

  const [msg, setMsg] = useState('');
  const [cityF, setCityF] = useState(null);
  const pickCity = (c) => { setCityF(c); if (c) setTimeout(() => { const el = document.getElementById('tl-h'); if (el) el.scrollIntoView({ behavior:'smooth', block:'start' }); }, 60); };
  const timer = useRef(null);
  const toast = useCallback((m) => { setMsg(m); clearTimeout(timer.current); timer.current = setTimeout(() => setMsg(''), 2400); }, []);
  const sysDark = () => window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  const [theme, setTheme] = useState(() => document.documentElement.getAttribute('data-theme') || (sysDark() ? 'dark' : 'light'));
  const flipTheme = () => { const t = theme === 'dark' ? 'light' : 'dark'; setTheme(t); document.documentElement.setAttribute('data-theme', t); try { localStorage.setItem('trip:theme', t); } catch(e){} };
  useEffect(() => { window.scrollTo({ top:0 }); }, [tab]);
  useEffect(() => { document.title = SETUP.name || 'Trip planner'; }, [SETUP.name]);
  const toggleDone = (id) => setDone(d => ({ ...d, [id]: !d[id] }));
  const doneCount = ALL_ACTS.filter(a => done[a.id]).length;
  const reset = () => { setDone({}); setNotes({}); setPack(p => ({ ...p, checked:{} })); setSpend([]); toast('Progress cleared'); };
  const openSetup = () => setSetupOpen(true);
  const TABS = [
    { id:'timeline', label:'Itinerary', icon:I('CalendarDays') },
    { id:'map', label:'Map', icon:I('Map') },
    { id:'bookings', label:'Bookings', icon:I('Ticket'), badge:(bookings || []).filter(b => effStatus(b).s === 'action').length },
    { id:'hotels', label:'Hotels', icon:I('BedDouble') },
    { id:'drive', label:'Drive', icon:I('Car') },
    { id:'utilities', label:'Utilities', icon:I('Wrench') },
  ];
  let body;
  if (tab === 'bookings') body = html`<${Bookings} bookings=${bookings} setBookings=${setBookings} toast=${toast} />`;
  else if (tab === 'hotels') body = html`<${Hotels} hotels=${hotels} setHotels=${setHotels} toast=${toast} />`;
  else if (tab === 'map') body = html`<${MapTab} hotels=${hotels} />`;
  else if (tab === 'drive') body = html`<${Drive} />`;
  else if (tab === 'utilities') body = html`<${Utilities} setup=${SETUP} setSetup=${setSetup} onSetup=${openSetup} done=${done} notes=${notes} bookings=${bookings} hotels=${hotels} toast=${toast} onReset=${reset} phrases=${phrases} setPhrases=${setPhrases} pack=${pack} setPack=${setPack} spend=${spend} setSpend=${setSpend} />`;
  else body = html`<${Timeline} done=${done} toggleDone=${toggleDone} notes=${notes} setNotes=${setNotes} toast=${toast} editItin=${editItin} cityF=${cityF} setCityF=${setCityF} onSetup=${openSetup} />`;
  return html`<${MotionConfig} reducedMotion="user">
    <div class="wrap">
      <${Header} doneCount=${doneCount} total=${ALL_ACTS.length} onTheme=${flipTheme} dark=${theme === 'dark'} compact=${tab !== 'timeline'} cityF=${cityF} onCity=${pickCity} onSetup=${openSetup} />
      <${AnimatePresence} mode="wait" initial=${false}>
        <${motion.main} key=${tab} initial=${{ opacity:0, y:8 }} animate=${{ opacity:1, y:0 }} exit=${{ opacity:0, y:-6 }} transition=${{ duration:.2 }}>${body}<//>
      <//>
    </div>
    <nav class="nav" aria-label="Sections">
      <div class="flex" style=${{ maxWidth:720, margin:'0 auto' }}>
        ${TABS.map(t => html`<button key=${t.id} onClick=${() => setTab(t.id)} aria-current=${tab === t.id ? 'page' : undefined}>
          ${tab === t.id && html`<${motion.span} layoutId="pip" className="pip" transition=${{ type:'spring', stiffness:500, damping:38 }} />`}
          <span class="relative inline-flex"><${t.icon} size=${21} strokeWidth=${tab === t.id ? 2.2 : 1.8} />
            ${t.badge > 0 && html`<span style=${{ position:'absolute', top:-4, right:-8, minWidth:16, height:16, padding:'0 4px', borderRadius:8, background:'var(--momiji)', color:'#fff', fontSize:10, fontWeight:700, display:'grid', placeItems:'center' }}>${t.badge}</span>`}
          </span>
          <span style=${{ maxWidth:'100%', overflow:'hidden', textOverflow:'ellipsis' }}>${t.label}</span>
        </button>`)}
      </div>
    </nav>
    <${AnimatePresence}>${setupOpen && html`<${SetupEditor} key="setup" setup=${SETUP} onClose=${() => setSetupOpen(false)} onSave=${s => { setSetup(s); setSetupOpen(false); toast('Trip saved'); }} />`}<//>
    <${Toast} msg=${msg} />
  <//>`;
}

RD.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</body>
</html>
