:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); background:var(--paper); }
body{ margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased; transition:background .3s,color .3s; }
img{ max-width:100%; }
.serif{ font-family:var(--serif); }
.wrap{ max-width:720px; margin:0 auto; padding:0 18px 120px; }
.surface{ background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
.muted{ color:var(--ink2); } .faint{ color:var(--ink3); }
button{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--sakura); outline-offset:2px; border-radius:6px; }
.chip{ display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); font-size:13px; white-space:nowrap; cursor:pointer; transition:background .2s,border-color .2s,color .2s; }
.chip[aria-pressed="true"]{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.tag{ font-size:11.5px; padding:1px 8px; border-radius:999px; background:var(--sunk); color:var(--ink2); }
.tag.must{ background:var(--sakura-wash); color:var(--sakura); }
.tag.shop{ background:var(--moss-wash); color:var(--moss); }
.tag.trip{ background:var(--ochre-wash); color:var(--ochre); }
.badge{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:500; padding:3px 10px; border-radius:999px; cursor:pointer; border:0; }
.badge .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
.badge.pending{ background:var(--ochre-wash); color:var(--ochre); }
.badge.booked{ background:var(--moss-wash); color:var(--moss); }
.badge.action{ background:var(--momiji-wash); color:var(--momiji); }
.rail{ position:absolute; left:27px; top:0; bottom:0; width:1px; background:var(--line); }
.daynum{ font-family:var(--serif); font-weight:700; font-size:30px; line-height:1; letter-spacing:-.02em; }
.check{ width:22px; height:22px; flex:none; border-radius:50%; border:1.5px solid var(--ink3); display:grid; place-items:center; cursor:pointer; background:transparent; transition:all .2s; padding:0; }
.check[aria-checked="true"]{ background:var(--moss); border-color:var(--moss); color:var(--paper); }
.done .act-title{ text-decoration:line-through; text-decoration-color:var(--ink3); color:var(--ink3); }
textarea, input, select{ font:inherit; color:var(--ink); background:var(--sunk); border:1px solid var(--line); border-radius:10px; padding:10px 12px; width:100%; }
textarea:focus, input:focus, select:focus{ outline:2px solid var(--sakura-soft); border-color:var(--sakura); }
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 16px; border-radius:12px; border:1px solid var(--line); background:var(--surface); font-weight:500; cursor:pointer; transition:background .2s, transform .1s; }
.btn:hover{ background:var(--sunk); } .btn:active{ transform:scale(.98); }
.btn.primary{ background:var(--ink); color:var(--paper); border-color:var(--ink); }
.btn.primary:hover{ opacity:.92; }
.nav{ position:fixed; left:0; right:0; bottom:0; z-index:40; padding-bottom:env(safe-area-inset-bottom,0px); background:color-mix(in srgb, var(--paper) 86%, transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--line); }
.nav button{ flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:10px 2px 12px; background:none; border:0; cursor:pointer; color:var(--ink3); font-size:10.5px; position:relative; white-space:nowrap; }
.nav button[aria-current="page"]{ color:var(--ink); }
.nav .pip{ position:absolute; top:0; height:2px; width:28px; border-radius:2px; background:var(--sakura); }
.scroller{ overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
.scroller::-webkit-scrollbar{ display:none; }
.stamp{ font-family:var(--serif); font-weight:700; font-size:15px; width:44px; height:44px; display:grid; place-items:center; border-radius:10px; border:1px solid var(--line); color:var(--cc); background:var(--surface); writing-mode:vertical-rl; letter-spacing:.08em; transition:all .3s; }
.stamp.on{ border:2px solid var(--cc); background:var(--cw); }
.stamp.sel{ background:var(--cc); color:var(--surface); border:2px solid var(--cc); }

.chip.city{ color:var(--cc); }
.phrase{ font-family:var(--serif); font-size:clamp(26px,7vw,36px); font-weight:700; letter-spacing:.04em; line-height:1.3; }
.toast{ position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:50; background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:999px; font-size:13.5px; box-shadow:var(--shadow); white-space:nowrap; }

  ['17:15','20:00','Lounge 1: Changi Lounge, Jewel Level 1','Same floor as early check-in. Priority Pass (Citi Prestige) with your boarding pass, subject to capacity; 3-hour limit; open until 22:00. Showers are closed until 15 Nov 2026, so freshen up at home. Free-flow snacks — ask at reception whether Priority Pass includes the hot meal and beer. Step out for the Rain Vortex light show if timing works.',['food'],'17:15'],
  ['20:00','20:30','Walk to T1 and clear immigration','Bags are already checked, so go straight through departure immigration.',[],'20:00'],
  ['20:30','22:00','Lounge 2: Plaza Premium Lounge, T1 airside','Best of the T1 options for hot food and runway views. If it’s full, try SATS Premier Lounge (good local dishes) or Marhaba (quieter, more basic). Citi Prestige gives 12 Priority Pass visits a year and a guest uses one of them — tonight uses 4.',['food'],'20:30'],
  ['22:00','22:25','Walk to the gate','Changi does security at the gate itself. Boarding usually starts about 40 minutes before departure.',[],'22:00'],
  ['23:05','23:59','Depart Singapore on Scoot TR884','Changi Terminal 1. Scheduled 23:05 gate departure (Boeing 787); recent flights have taken off around 23:15–23:30. Check-in closes 22:05. Overnight to Narita Terminal 1, landing 07:05.',[],'23:05'],
 ]},

  ['08:00','08:20','Hand suitcases to Airporter (same-day delivery)','✅ Booked — transaction no. 1016-2068. Drop-off: Narita Terminal 1, International Arrivals floor (1F), South Wing — JAL ABC counter. Booked for 08:00; must be dropped off by 13:00 at the latest. Both suitcases go to Onyado Nono Asakusa and arrive later today. If you land in the North Wing, walk through the central building to the South Wing. Keep tonight’s essentials, passports, medicines and power banks with you.',[],'08:00'],
  ['08:15','09:30','Keisei Skyliner to Ueno, subway to Asakusa','About 41 minutes on the Skyliner, then the Ginza Line to Asakusa. With your suitcases on their way to the hotel, head straight out exploring — no hotel stop needed.',[]],

 { date:'2026-11-11', city:'Tokyo', area:'Omotesando, Harajuku, Shibuya', stay:STAY.nono, title:'Hand rolls, Omotesando and Shibuya', food:['Gonpachi Nori-Temaki','Iyoshi Cola','Uobei Shibuya','Kura Sushi Harajuku (backup)'], acts:[
  ['08:30','09:30','Wake up and morning routine','',[],'08:30'],
  ['10:30','11:15','Ginza Line to Omotesando','From Asakusa Station, then a 10-minute walk up Omotesando to Harajuku.',[]],
  ['11:30','12:30','Gonpachi Nori-Temaki Harajuku','Hand rolls made fresh at the counter around an open kitchen, with crisp nori and warm rice. No reservations — arrive at opening (listed as 11:30; check Google Maps) for little or no wait. About 30 seats. About ¥2,000 each at lunch. Cards, Suica or QR only — no cash. 2 min from JR Harajuku, 1 min from Meiji-Jingumae Station.',['food','beef'],'Lunch','Seafood hand rolls — skip any beef ones'],
  ['12:30','16:00','Omotesando, Cat Street and Harajuku','Your best Tokyo stretch for shoes and clothes: sneaker and streetwear shops along Cat Street and around Harajuku, flagship stores on Omotesando, and Takeshita Street for cheap, fun buys. Easy walk down to Shibuya. Bring your passport for tax-free purchases.',[]],
  ['16:30','18:30','Shibuya: Iyoshi Cola and Miyashita Park','Craft cola (the stand is open 13:00–19:00, at the Shibuya end of Cat Street), then the rooftop park and its shops. Shibuya Parco and Don Quijote (snacks, cosmetics, souvenirs) are a few minutes away.',['food','beef'],null,'Craft botanical cola'],
  ['19:00','20:30','Uobei Shibuya Dogenzaka (conveyor-style sushi)','Fun, budget sushi: order on the touchscreen and plates shoot straight to your seat on a fast lane. No booking — expect a short queue at dinnertime. A few minutes’ walk from Shibuya Station and Miyashita Park. Skip any beef or hamburg plates. Backup if the queue is long: Kura Sushi’s global flagship in Harajuku (one stop on the JR Yamanote Line) — same touchscreen ordering, plus the Bikkura-pon prize game every 5 plates.',['food','beef'],'Dinner','Seafood plates — skip beef and hamburg sushi'],
 ]},

 { date:'2026-11-14', city:'Tokyo', area:'Ginza, Komagome & Yurakucho', stay:STAY.kyobashi, title:'Hachigou lunch, Rikugien garden and Yurakucho', food:['Ginza Hachigou','Ginza Six coffee','Yurakucho yakitori'], acts:[

  ['14:30','16:45','Rikugien Garden','Edo-period strolling garden with a central pond, tea houses and hilltop views. Pay at the gate, no booking needed. The garden closes at 17:00 — aim to enter by 16:30. Its autumn night light-up usually runs late November to early December (2026 dates not out yet), so it’ll be after you leave Tokyo.',['must']],

  ['19:15','20:30','✨ Marunouchi Illumination','Free — no booking needed. Champagne-gold trees along about 1.2 km of Marunouchi Naka-dori, a few minutes’ walk from Yurakucho; 2026 season runs 12 Nov – 14 Feb, lit 16:00–23:00. The Marunouchi Building atrium (Marucube) usually has a big Christmas tree too, then it’s an easy walk back to Kyobashi.',['must']],

  ['09:00','09:20','Optional: send suitcases to Osaka (Yamato)','At the Sora Niwa Terrace front desk, send your suitcases to Hotel Royal Classic Osaka for arrival on 21 Nov — no lugging bags on a busy Saturday. Write your name and 21 Nov check-in date on the slip. Keep tonight’s and tomorrow morning’s things with you. Skip this if you’d rather just take them on the 30–40 minute train.',[],'09:00'],

  ['10:00','11:15','Ginkaku-ji (Silver Pavilion)','Moss garden, raked sand cone and a hillside loop above the pavilion.',['must']],
  ['11:15','12:30','Sushi Ishimatsu','Homely tatami sushi counter just south of Ginkaku-ji, by Honen-in. Reviewers rave about thick, generous cuts — try the chirashi bowl or the 8-piece nigiri. Opens 11:00; expect a queue of around 30 minutes, no reservations noted. Closed Wed–Thu, open today. ★4.9 on Google. Backup: Omen udon nearby.',['must','food','beef'],null,'Seafood — good for both of you'],

  ['16:00','18:00','Nishiki Market and Shijo-dori','Back near the hotel for street food and shopping — food souvenirs at Nishiki, plus Takashimaya and Daimaru department stores on Shijo-dori.',['food','beef'],null,'Beef-free snacks — walk past the wagyu stalls'],
  ['18:00','19:15','Rooftop footbath and an easy dinner','Last Kyoto night; pack after you get back.',['food'],'Evening'],
  ['19:30','20:45','✨ Eikan-do night viewing','Maples reflected in the pond — one of Kyoto’s best light-ups. Separate evening ticket bought at the gate: ¥1,000; daytime tickets don’t cover it. 2026 season: 20 Nov – 6 Dec, 17:30–21:00, last entry 20:30 — tonight is the opening night. About 15 minutes by taxi.',['must']],
 ]},

  ['13:00','16:45','Shopping: Shinsaibashi, Amerikamura and Namba','Your biggest free window for shoes and clothes, two days before you fly — so less to carry. Shinsaibashi-suji covered arcade and Midosuji for big fashion and shoe brands; Amerikamura next door for vintage and streetwear; Namba Parks and Takashimaya by Namba Station; Don Quijote Dotonbori for snacks, cosmetics and souvenirs. Bring passports and keep receipts — tax back needs ¥5,000+ before tax per shop. Drop bags at the hotel before dinner.',[],'13:00'],

const TRIP_START = '2026-11-09', TRIP_END = '2026-11-23';
const parse = (s) => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today0 = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const daysUntil = (s) => Math.round((parse(s) - today0()) / 864e5);
const fmt = (s, o) => parse(s).toLocaleDateString('en-GB', o || { weekday:'short', day:'numeric', month:'short' });
const tripState = () => {
  const a = daysUntil(TRIP_START), b = daysUntil(TRIP_END);
  if (a > 0) return { phase:'before', days:a };
  if (b >= 0) return { phase:'during', day:-a };
  return { phase:'after' };
};

/* ---------- clipboard / downloads ---------- */
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch(e) {
    try { const ta = document.createElement('textarea'); ta.value = t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch(_) { return false; }
  }
}
let dlPromise = null;
const getDownloads = () => { if (!dlPromise) dlPromise = (window.claude && window.claude.use) ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null); return dlPromise; };
async function saveFile(filename, data, fallbackText){
  const dl = await getDownloads();
  if (dl) {
    try { await dl.save({ filename, data }); return 'saved'; }
    catch(e) { if (e && e.code === 'declined') return 'declined'; }
  }
  if (fallbackText != null && await copyText(fallbackText)) return 'copied';
  return 'failed';
}

}

const NO_PLACE = /^(wake up|pack\b|free morning|last bakery haul|gift shopping|farewell dinner)/i;
const placeQueries = (a, day) => {
  if (a.place && a.place.trim()) return a.place.split(',').map(x => x.trim()).filter(Boolean);
  if (PLACE_Q[a.title]) return PLACE_Q[a.title];
  if (NO_PLACE.test(a.title) || day.city === 'Flight') return [];
  return [a.title.replace(/^(photoshoot|lunch at|dinner at|travel to):?\s*/i, '').replace(/[🍁🗻]/gu, '').trim()];
};

/* ---------- next up ---------- */
const atTime = (d, t) => { const [y,m,dd] = d.split('-').map(Number); const [h,mi] = (t || '00:00').split(':').map(Number); return new Date(y, m-1, dd, h || 0, mi || 0); };
function findNext(done, now){
  const items = ALL_ACTS.map(a => {
    const d = a.date || a.day.date, st = atTime(d, a.start);
    let en = atTime(d, a.end || a.start); if (en <= st) en = new Date(st.getTime() + (a.end && a.end < a.start ? 864e5 : 30 * 6e4));
    return { a, st, en };
  }).sort((x, y) => x.st - y.st);
  const cur = items.find(x => x.st <= now && now < x.en && !done[x.a.id]) || null;
  const nxt = items.find(x => x.st > now && !done[x.a.id] && (!cur || x.a.id !== cur.a.id)) || null;
  return { cur, nxt };
}
const until = (ms) => {
  const m = Math.round(ms / 6e4);
  if (m < 1) return 'now';
  if (m < 60) return 'in ' + m + ' min';
  const h = Math.floor(m / 60), r = m % 60;
  if (h < 24) return 'in ' + h + ' h' + (r ? ' ' + r + ' min' : '');
  const d = Math.round(ms / 864e5);
  return 'in ' + d + (d === 1 ? ' day' : ' days');
};
function NextUp({ done, toggleDone, onGo }){
  const [now, setNow] = useState(() => new Date());
  useEffect(() => { const t = setInterval(() => setNow(new Date()), 30000); return () => clearInterval(t); }, []);
  const { cur, nxt } = findNext(done, now);
  if (!cur && !nxt) return null;
  const Nav = I('Navigation'), Check = I('Check'), Clock = I('Clock');
  const Row = ({ x, kind }) => {
    const a = x.a, q = placeQueries(a, a.day)[0];
    const left = kind === 'now' ? Math.round((x.en - now) / 6e4) : null;
    return html`<div style=${{ ...cityVars(a.day.city), padding:'14px 16px', borderLeft:'4px solid var(--cc)', borderTop: kind === 'next' && cur ? '1px solid var(--line)' : 0 }}>
      <div class="flex items-center justify-between gap-2">
        <span style=${{ fontSize:11.5, fontWeight:700, letterSpacing:'.08em', textTransform:'uppercase', color: kind === 'now' ? 'var(--sakura)' : 'var(--ink3)' }}>${kind === 'now' ? 'Happening now' : 'Next up'}</span>
        <span class="faint flex items-center gap-1" style=${{ fontSize:12.5 }}><${Clock} size=${13} />${kind === 'now' ? (left >= 60 ? 'ends ' + a.end : left + ' min left') : until(x.st - now)}</span>
      </div>
      <button onClick=${() => onGo(a.day.n)} class="text-left" style=${{ background:'none', border:0, padding:0, marginTop:6, cursor:'pointer', color:'var(--ink)', display:'block', width:'100%' }}>
        <div class="serif" style=${{ fontSize:18, fontWeight:700, lineHeight:1.3 }}>${a.title}</div>
        <div class="muted" style=${{ fontSize:13, marginTop:3 }}>${fmt(a.date || a.day.date, { weekday:'short', day:'numeric', month:'short' })} · ${a.start}–${a.end} · Day ${a.day.n}, ${a.day.city}</div>
      </button>
      <div class="flex gap-2" style=${{ marginTop:10 }}>
        ${q && html`<a class="btn primary" style=${{ padding:'7px 12px', fontSize:13 }} href=${planMapsUrl(q)} target="_blank" rel="noopener"><${Nav} size=${14} />Directions</a>`}
        <button class="btn" style=${{ padding:'7px 12px', fontSize:13 }} onClick=${() => toggleDone(a.id)}><${Check} size=${14} />Done</button>
      </div>
    </div>`;
  };
  return html`<div class="surface" style=${{ marginTop:16, overflow:'hidden' }} aria-live="polite">
    ${cur && html`<${Row} x=${cur} kind="now" />`}
    ${nxt && html`<${Row} x=${nxt} kind="next" />`}
  </div>`;
}

let JA_VOICE = null;
function pickVoice(){ try { const vs = speechSynthesis.getVoices() || []; JA_VOICE = vs.find(v => /^ja(-|_|$)/i.test(v.lang)) || null; } catch(e){} }
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch(e){}
function speak(t, rate, onFail){
  const ss = window.speechSynthesis;
  if (!ss || typeof SpeechSynthesisUtterance === 'undefined') { onFail && onFail('unsupported'); return; }
  try {
    if (!JA_VOICE) pickVoice();
    const voices = ss.getVoices ? ss.getVoices() : [];
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'ja-JP'; u.rate = rate || .9; u.volume = 1; u.pitch = 1;
    if (JA_VOICE) u.voice = JA_VOICE;
    let started = false;
    u.onstart = () => { started = true; };
    u.onerror = (e) => { if (e && (e.error === 'interrupted' || e.error === 'canceled')) return; onFail && onFail(e && e.error || 'error'); };
    if (ss.speaking || ss.pending) ss.cancel();
    if (ss.paused) ss.resume();
    ss.speak(u);
    setTimeout(() => { if (!started && !ss.speaking) onFail && onFail(voices.length && !JA_VOICE ? 'novoice' : 'silent'); }, 1800);
  } catch (e) { onFail && onFail('error'); }
}

/* ---------- Mt Fuji ---------- */
function Fuji({ embedded }){
  const Ext = I('ExternalLink'), Eye = I('Eye'), Check = I('Check'), Mountain = I('MountainSnow');
  const [seen, setSeen] = usePersist('fuji', {});
  return html`<section aria-labelledby="fj-h">
    ${!embedded && html`<div style=${{ marginTop:28 }}>
      <div class="flex items-end gap-3">
        <${SectionIcon} name="MountainSnow" /><h2 id="fj-h" class="serif" style=${{ fontSize:40, fontWeight:700, margin:0, lineHeight:1 }}>富士山</h2>
        <span class="muted" style=${{ fontSize:14, paddingBottom:4 }}>Mount Fuji · 3,776 m</span>
      </div>
      <svg viewBox="0 0 320 70" style=${{ width:'100%', height:'auto', marginTop:14, display:'block' }} aria-hidden="true">
        <path d="M0 70 L120 22 Q135 14 150 16 Q160 12 170 16 Q185 14 200 22 L320 70 Z" fill="var(--sunk)"/>
        <path d="M120 22 Q135 14 150 16 Q160 12 170 16 Q185 14 200 22 L182 30 L172 26 L160 32 L148 26 L138 30 Z" fill="var(--surface)" stroke="var(--line)"/>
      </svg>
    </div>`}

    <h3 style=${{ fontSize:16, fontWeight:700, margin: embedded ? '4px 0 4px' : '20px 0 4px' }}>Check the live forecast</h3>
    <p class="muted" style=${{ margin:0, fontSize:13.5 }}>Live weather can’t load inside this page, so these open the best sources in a new tab. Check the evening before and again at breakfast.</p>
    <ul style=${{ margin:'12px 0 0', padding:0 }}>
      ${FUJI_LINKS.map(l => html`<li key=${l.url} style=${{ listStyle:'none', marginBottom:8 }}>
        <a href=${l.url} target="_blank" rel="noopener" class="surface flex items-center justify-between gap-3" style=${{ padding:'14px 16px', textDecoration:'none', color:'inherit' }}>
          <span style=${{ minWidth:0 }}><span style=${{ fontWeight:500, display:'block' }}>${l.title}</span><span class="muted" style=${{ fontSize:13 }}>${l.sub}</span></span>
          <${Ext} size=${16} style=${{ flex:'none', color:'var(--ink3)' }} />
        </a></li>`)}
    </ul>

    <h3 style=${{ fontSize:16, fontWeight:700, margin:'24px 0 4px' }}>Your chances to see it</h3>
    <p class="muted" style=${{ margin:0, fontSize:13.5 }}>Tick it off when you spot the peak.</p>
    <ol style=${{ margin:'12px 0 0', padding:0 }}>
      ${FUJI_SPOTS.map(s => { const d = daysUntil(s.date); const day = DAYS.find(x => x.date === s.date); return html`<li key=${s.id} class="surface flex gap-3" style=${{ listStyle:'none', padding:16, marginBottom:10 }}>
        <button class="check" role="checkbox" aria-checked=${!!seen[s.id]} aria-label=${'Saw Fuji from ' + s.where} onClick=${() => setSeen(v => ({ ...v, [s.id]: !v[s.id] }))}>${seen[s.id] && html`<${Check} size=${13} strokeWidth=${3} />`}</button>
        <div style=${{ minWidth:0, flex:1 }}>
          <div class="faint flex justify-between gap-2" style=${{ fontSize:12.5 }}><span>Day ${day ? day.n : ''} · ${fmt(s.date)} · ${s.when}</span><span>${d > 0 ? 'in ' + d + 'd' : d === 0 ? 'today' : ''}</span></div>
          <div style=${{ fontWeight:500, marginTop:2 }}>${s.where}${seen[s.id] ? ' — spotted' : ''}</div>
          <p class="muted" style=${{ margin:'3px 0 0', fontSize:13.5 }}>${s.tip}</p>
        </div>
      </li>`; })}
    </ol>

    <h3 style=${{ fontSize:16, fontWeight:700, margin:'24px 0 8px' }}>What mid-November is like</h3>
    <div class="surface" style=${{ padding:16 }}>
      <dl class="kv" style=${{ margin:0 }}>
        <dt style=${{ marginTop:0 }}>Summit</dt><dd>Snow-capped and well below freezing. Climbing trails are closed outside the summer season.</dd>
        <dt>Around the lakes</dt><dd>Cold, crisp mornings near freezing; mild afternoons. Pack a warm layer for any early start.</dd>
        <dt>Visibility</dt><dd>The peak is visible on only around 70–100 days a year, with the best odds in the clear, dry months of late autumn and winter. Mornings beat afternoons — haze and cloud usually build after midday. Clear days often follow a passing cold front.</dd>
      </dl>
    </div>
  </section>`;
}

        </div>
        <${motion.span} animate=${{ rotate: open ? 180 : 0 }} transition=${{ duration:.25 }} style=${{ display:'inline-flex', color:'var(--ink3)', marginTop:2 }}><${Chevron} size=${20} /><//>

              <button class="check" role="checkbox" aria-checked=${!!done[i]} aria-label=${'Mark step ' + (i + 1) + ' done'} onClick=${() => setDone(d => ({ ...d, [i]: !d[i] }))}>${done[i] && html`<${Check} size=${13} strokeWidth=${3} />`}</button>
              <div style=${{ minWidth:0 }}>
                <div class="act-title" style=${{ fontWeight:500 }}><span class="faint" style=${{ marginRight:6 }}>${i + 1}.</span>${s.t}</div>
                <p class="muted" style=${{ margin:'3px 0 0', fontSize:13.5 }}>${s.d}</p>
                ${i === 1 && html`<a class="btn primary" style=${{ marginTop:10, padding:'8px 14px' }} href="https://www.post.japanpost.jp/service/send/oversea/use/label/index_en.html" target="_blank" rel="noopener"><${Ext} size=${15} />Japan Post: prepare a label</a>`}

          <div class="flex flex-wrap gap-2" style=${{ marginTop:8 }}>${LABEL_WORDS_JP.map(([k, v]) => html`<span key=${k} class="tag" style=${{ fontSize:13, padding:'3px 10px' }}><b class="serif" style=${{ marginRight:6 }}>${k}</b>${v}</span>`)}</div>
          <p class="muted" style=${{ fontSize:13, margin:'14px 0 0' }}>Handwritten labels aren’t accepted for overseas parcels, and one label can’t be reused for a second box. Phrases for the counter are in Utilities › Japanese phrasebook › Digital label.</p>

        </div>
      <//>`}
    <//>
  </div>`;
}

const distM = (a, b) => { const R = 6371000, r = Math.PI / 180; const dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r; const h = Math.sin(dLat/2)**2 + Math.cos(a.lat*r) * Math.cos(b.lat*r) * Math.sin(dLng/2)**2; return 2 * R * Math.asin(Math.sqrt(h)); };
const fmtDist = (m) => m < 950 ? Math.round(m / 10) * 10 + ' m' : (m / 1000).toFixed(1) + ' km';
const walkMin = (m) => Math.max(1, Math.round(m * 1.25 / 80));
const placeUrl = (p) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.name) + '&query_place_id=' + p.pid;
const placeDir = (p) => 'https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=' + encodeURIComponent(p.name) + '&destination_place_id=' + p.pid;
const BEEF_BADGE = { low:['Beef-free friendly','low'], ask:['Ask about beef','ask'], pork:['Pork chashu only','unknown'] };

function NearbyMap({ center, me, pts, sel, onSel }){
  const W = 360, H = 250, cx = W / 2, cy = H / 2;
  const k = Math.cos(center.lat * Math.PI / 180) * 111320, kl = 110540;
  const xy = (p) => [(p.lng - center.lng) * k, -(p.lat - center.lat) * kl];
  const all = [...pts.map(p => xy(p)), ...(me ? [xy(me)] : [])];
  const s = Math.min((H / 2 - 22) / 250, ...all.map(([x, y]) => Math.min(Math.abs(x) > 1 ? (W / 2 - 16) / Math.abs(x) : Infinity, Math.abs(y) > 1 ? (H / 2 - 16) / Math.abs(y) : Infinity)));
  const ringsM = [100, 250, 500, 1000, 2000, 5000].filter(r => r * s < Math.max(W, H) / 2 && r * s > 18);
  return html`<svg viewBox=${'0 0 ' + W + ' ' + H} style=${{ width:'100%', height:'auto', display:'block', background:'var(--sunk)', borderRadius:12 }} role="img" aria-label="Map of nearby places around your hotel">
    ${ringsM.map(r => html`<g key=${r}><circle cx=${cx} cy=${cy} r=${r * s} fill="none" stroke="var(--line)" strokeDasharray="3 4" /><text x=${cx + r * s * .71 + 3} y=${cy - r * s * .71 - 3} fontSize="9" fill="var(--ink3)">${fmtDist(r)}</text></g>`)}
    <line x1=${cx} y1="6" x2=${cx} y2="18" stroke="var(--ink3)" /><text x=${cx + 4} y="15" fontSize="9" fill="var(--ink3)">N</text>
    ${me && (() => { const [x, y] = xy(me); return html`<g><circle cx=${cx + x * s} cy=${cy + y * s} r="7" fill="#2F7DE1" stroke="white" strokeWidth="2.5" /><text x=${cx + x * s + 10} y=${cy + y * s + 3} fontSize="10" fontWeight="700" fill="#2F7DE1">You</text></g>`; })()}
    <g><rect x=${cx - 9} y=${cy - 9} width="18" height="18" rx="5" fill="var(--ink)" /><text x=${cx} y=${cy + 4} fontSize="11" fontWeight="700" textAnchor="middle" fill="var(--paper)">H</text></g>
    ${pts.map((p, i) => { const [x, y] = xy(p); const on = sel === p.pid; return html`<g key=${p.pid} style=${{ cursor:'pointer' }} onClick=${() => onSel(p.pid)}>
      <circle cx=${cx + x * s} cy=${cy + y * s} r=${on ? 11 : 8.5} fill=${NB_CATS[p.cat].color} stroke=${on ? 'var(--ink)' : 'var(--surface)'} strokeWidth=${on ? 2.5 : 1.5} />
      <text x=${cx + x * s} y=${cy + y * s + 3.5} fontSize=${on ? 11 : 9.5} fontWeight="700" textAnchor="middle" fill="white">${i + 1}</text></g>`; })}
  </svg>`;
}

  const locate = () => {
    if (!navigator.geolocation) { toast('Location isn’t available here'); return; }

  const farFromArea = me && distM(me, area) > 5000;

        <div style=${{ padding:'0 18px 18px', borderTop:'1px solid var(--line)' }}>
          <div class="scroller flex gap-2" style=${{ margin:'14px -18px 8px', padding:'2px 18px' }} role="group" aria-label="Choose area">
            ${NEARBY.map(a => html`<button key=${a.id} class="chip city" style=${cityVars(a.city)} aria-pressed=${a.id === area.id} onClick=${() => { setAreaId(a.id); setSel(null); }}>${a.area} · ${fmt(a.from,{ day:'numeric', month:'short' })}</button>`)}
          </div>

          </div>

          <div class="flex items-center justify-between gap-2 flex-wrap" style=${{ marginTop:8 }}>

              ${Object.entries(NB_CATS).map(([k, v]) => html`<a key=${k} class="btn" style=${{ padding:'8px 6px', fontSize:12.5 }} href=${searchUrl(k)} target="_blank" rel="noopener"><${Ext} size=${13} />${v.short}</a>`)}

          <p class="faint" style=${{ fontSize:11.5, margin:'12px 0 0' }}>Places and hours from Google Maps, saved October 2026 — check before you go. Hotel pins from Google Maps.</p>

      <//>`}
    <//>
  </div>`;
}

  const midLat = pts.reduce((a, p) => a + p.lat, 0) / pts.length;
  const kx = Math.cos(midLat * Math.PI / 180);
  const xs = pts.map(p => p.lng * kx), ys = pts.map(p => -p.lat);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const H = Math.round(Math.min(300, Math.max(190, (maxY - minY) / ((maxX - minX) || 1) * (W - 2 * pad) + 2 * pad)));
  const sc = Math.min((W - 2 * pad) / (maxX - minX || 1), (H - 2 * pad) / (maxY - minY || 1));
  const ox = (W - (maxX - minX) * sc) / 2, oy = (H - (maxY - minY) * sc) / 2;

  return html`<div class="surface" style=${{ marginTop:16, overflow:'hidden' }}>

function Packing({ pack, setPack }){

  const add = () => { const t = txt.trim(); if (!t) return; setPack(p => ({ ...p, custom: [...(p.custom || []), { id:'c' + Date.now().toString(36), t }] })); setTxt(''); };
  const del = (id) => setPack(p => { const c = { ...(p.checked || {}) }; delete c[id]; return { checked:c, custom:(p.custom || []).filter(x => x.id !== id) }; });
  const total = PACK_N + custom.length;
  const n = PACK.reduce((k, g) => k + g.items.filter(([id]) => checked[id]).length, 0) + custom.filter(x => checked[x.id]).length;

  return html`<${Fold} id="pack" icon="Backpack" title="Packing checklist" summary=${n + ' of ' + total + ' packed' + (n === total ? ' — all set!' : '')}>

      <div class="faint" style=${{ fontSize:12, fontWeight:700, letterSpacing:'.06em', textTransform:'uppercase' }}>Your own items</div>
      <ul style=${{ margin:'2px 0 0', padding:0 }}>${custom.map(x => html`<${Item} key=${x.id} id=${x.id} t=${x.t} onDel=${() => del(x.id)} />`)}</ul>

    </div>
  <//>`;
}

const FX_DEFAULT = 123.54; // yen per SGD, 14 Oct 2026
const SPEND_CATS = [['food','Food'],['transport','Transport'],['shopping','Shopping'],['sights','Sights'],['stay','Stay'],['other','Other']];
const SPEND_LABEL = Object.fromEntries(SPEND_CATS);
const yen = (n) => '¥' + Math.round(n).toLocaleString('en-US');

function Money({ spend, setSpend, toast }){

  const onSg = (v) => { setSg(v); const n = parseFloat(String(v).replace(/,/g, '')); setJy(isFinite(n) ? String(Math.round(n * r)) : ''); };
  useEffect(() => { onJy(jy); }, [r]);
  const [amt, setAmt] = useState(''), [desc, setDesc] = useState(''), [cat, setCat] = useState('food'), [date, setDate] = useState(todayISO());
  const add = () => {

  const total = list.reduce((t, x) => t + x.yen, 0);
  const byCat = SPEND_CATS.map(([id, l]) => [id, l, list.filter(x => x.cat === id).reduce((t, x) => t + x.yen, 0)]).filter(x => x[2] > 0);
  const byDay = list.reduce((m, x) => { (m[x.date] = m[x.date] || []).push(x); return m; }, {});

  return html`<${Fold} id="money" icon="Coins" title="Yen converter & spending" summary=${list.length ? yen(total) + ' spent · about ' + sgd(total / r) : '¥1,000 ≈ ' + sgd(1000 / r) + '. Log what you spend as you go.'}>

      ${Number(rate) !== FX_DEFAULT && html`<button class="chip" style=${{ borderStyle:'dashed' }} onClick=${() => setRate(FX_DEFAULT)}>Reset</button>`}</label>
    <p class="faint" style=${{ fontSize:12, margin:'4px 0 0' }}>Default is the mid-market rate on 14 Oct 2026. Your card or money changer will be a little worse — update it when you change money.</p>

    <form onSubmit=${e => { e.preventDefault(); add(); }} style=${{ marginTop:8 }}>

function Utilities({ done, notes, status, toast, onReset, edited, onRestore, pack, setPack, spend, setSpend }){
  const Sheet = I('FileSpreadsheet'), Cal = I('CalendarDays'), Dl = I('Download'), Phone = I('Phone'), Reset = I('RotateCcw'), Note = I('StickyNote');
  const rows = () => [['Day','Date','Weekday','City','Area','Stay','Time','Start','End','Plan','Details','Beef notes','Tags','Done','Day notes'],
    ...ALL_ACTS.map(a => [a.day.n, a.date || a.day.date, fmt(a.date || a.day.date,{ weekday:'short' }), a.day.city, a.day.area, a.day.stay, a.label || '', a.start, a.end, a.title, a.desc, a.beefNote || '', a.tags.filter(t => TAG_LABEL[t]).map(t => TAG_LABEL[t]).join('; '), done[a.id] ? 'Yes' : '', notes[a.day.n] || ''])];
  const exportCSV = async () => {
    const csv = '\uFEFF' + toCSV(rows());
    const r = await saveFile('japan-2026-itinerary.csv', csv, csv);
    toast(r === 'saved' ? 'Saved japan-2026-itinerary.csv' : r === 'copied' ? 'Download unavailable here — CSV copied to clipboard' : r === 'declined' ? 'Download cancelled' : 'Could not export');
  };
  const exportXLSX = async () => {
    if (!window.XLSX) { toast('Excel library did not load — use CSV instead'); return; }
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.aoa_to_sheet(rows());
    ws['!cols'] = [4,11,8,10,22,28,12,6,6,38,60,36,28,6,40].map(w => ({ wch:w }));
    XLSX.utils.book_append_sheet(wb, ws, 'Itinerary');
    const bk = [['Booking','Via','For date','Key date','Status','Rule','Note'], ...BOOKINGS.map(b => [b.title, b.via, b.event, b.key || '', STATUS[effStatus(b, status).s], b.rule, b.note])];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(bk), 'Bookings');
    const fd = [['Spot','Japanese','Source','Day','City','Area','Food type','Dish','Broth / base','Order','Beef risk','Tip'], ...FOOD.slice().sort((a,b) => a.day - b.day).map(f => [f.name, f.jp, f.rec ? 'Recommended' : 'Wishlist', f.day, f.city, f.area, kindOf(f).label, f.type, f.broth, f.eat, f.riskText, f.tip])];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(fd), 'Food');
    const ht = [['Hotel','City','Check-in','Check-out','Nights','Address','Japanese address','Access','Times','Phone','Google Maps'], ...HOTELS.map(h => [h.name, h.city, h.inD, h.outD, h.nights, h.addr, h.jpAddr, h.access.join(' / '), h.times, h.tel || '', mapsQ(h)])];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(ht), 'Hotels');
    if (spend && spend.length) { const fx = Number(store.get('fx-rate', FX_DEFAULT)) || FX_DEFAULT; XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet([['Date','What','Category','Yen','SGD (approx)'], ...spend.slice().sort((a,b) => a.date.localeCompare(b.date)).map(x => [x.date, x.desc, SPEND_LABEL[x.cat] || x.cat, x.yen, Math.round(x.yen / fx * 100) / 100])]), 'Spending'); }
    const buf = XLSX.write(wb, { bookType:'xlsx', type:'array' });
    const r = await saveFile('japan-2026-itinerary.xlsx', new Blob([buf]), null);
    toast(r === 'saved' ? 'Saved japan-2026-itinerary.xlsx' : r === 'declined' ? 'Download cancelled' : 'Download unavailable here — try CSV');
  };
  const exportGCal = async () => {
    const csv = toCSV([['Subject','Start Date','Start Time','End Date','End Time','All Day Event','Description','Location','Private'],
      ...ALL_ACTS.map(a => [a.title, usDate(a.date || a.day.date), ampm(a.start), usDate(a.date || a.day.date), ampm(a.end), 'False', a.desc + (a.beefNote ? '\nBeef: ' + a.beefNote : '') + (notes[a.day.n] ? '\n\nNotes: ' + notes[a.day.n] : ''), a.day.city === 'Flight' ? 'Singapore Changi Airport' : a.day.area + ', ' + a.day.city + ', Japan', 'True'])]);
    const r = await saveFile('japan-2026-google-calendar.csv', csv, csv);
    toast(r === 'saved' ? 'Saved — import it at calendar.google.com' : r === 'copied' ? 'Download unavailable here — CSV copied' : r === 'declined' ? 'Download cancelled' : 'Could not export');
  };
  const noteCount = Object.values(notes).filter(v => v && v.trim()).length;
  const doneCount = Object.values(done).filter(Boolean).length;
  const Card = ({ icon, title, body, children }) => html`<div class="surface" style=${{ padding:18, marginBottom:12 }}>
    <div class="flex items-center gap-2" style=${{ fontWeight:700 }}><${icon} size=${18} />${title}</div>
    ${body && html`<p class="muted" style=${{ fontSize:13.5, margin:'6px 0 0' }}>${body}</p>`}
    <div style=${{ marginTop:14 }}>${children}</div></div>`;
  return html`<section aria-labelledby="ut-h">
    <h2 id="ut-h" class="serif flex items-center gap-3" style=${{ fontSize:22, fontWeight:700, margin:'28px 0 14px' }}><${SectionIcon} name="Wrench" />Utilities</h2>

    ${html`<${Card} icon=${Sheet} title="Export itinerary" body="All 15 days with times, tags, check-offs and your notes.">
      <div class="grid grid-cols-2 gap-2">
        <button class="btn primary" onClick=${exportXLSX}><${Dl} size=${16} />Excel (.xlsx)</button>
        <button class="btn" onClick=${exportCSV}><${Dl} size=${16} />CSV</button>
      </div>
    <//>`}

    <${SyncCard} />

    <${PhrasebookSection} toast=${toast} />

    <${Money} spend=${spend} setSpend=${setSpend} toast=${toast} />

    <${TaxFree} />

    <${Packing} pack=${pack} setPack=${setPack} />

    <${LabelGuide} />

    ${html`<${Card} icon=${Cal} title="Google Calendar" body="Download a calendar file, then in Google Calendar open Settings › Import & export. Set that calendar’s time zone to Tokyo first so times land correctly. Each plan in the Itinerary tab also has its own add-to-calendar icon.">
      <button class="btn w-full" onClick=${exportGCal}><${Dl} size=${16} />Download Google Calendar file</button>
    <//>`}

    ${html`<${Card} icon=${Note} title="Saved on this device" body=${`${doneCount} plans checked off, notes on ${noteCount} ${noteCount === 1 ? 'day' : 'days'}. Everything is stored in this browser, so it stays put with no signal once the page is open.`}>
      <button class="btn w-full" style=${{ color:'var(--momiji)' }} onClick=${() => { if (confirm('Clear all check-offs, notes and booking statuses? If trip sync is on, this clears them for your partner too.')) onReset(); }}><${Reset} size=${16} />Clear saved progress</button>
    <//>`}

    ${edited && html`<${Card} icon=${Reset} title="Your itinerary edits" body="You’ve changed plans in the Itinerary tab. Restoring brings back the original itinerary; check-offs and notes stay.">
      <button class="btn w-full" onClick=${() => { if (confirm('Discard your itinerary edits and restore the original plan?')) onRestore(); }}><${Reset} size=${16} />Restore original itinerary</button>
    <//>`}

    ${html`<${Card} icon=${Phone} title="If something goes wrong">
      <dl class="kv" style=${{ margin:0 }}>
        <div class="flex justify-between"><dt style=${{ marginTop:0 }}>Police</dt><dd><a href="tel:110" style=${{ fontWeight:700 }}>110</a></dd></div>
        <div class="flex justify-between" style=${{ marginTop:8 }}><dt style=${{ marginTop:0 }}>Ambulance and fire</dt><dd><a href="tel:119" style=${{ fontWeight:700 }}>119</a></dd></div>
        <div class="flex justify-between" style=${{ marginTop:8 }}><dt style=${{ marginTop:0 }}>JNTO visitor hotline (24h, English)</dt><dd><a href="tel:+815038162787" style=${{ fontWeight:700, whiteSpace:'nowrap' }}>050-3816-2787</a></dd></div>
      </dl>
    <//>`}
  </section>`;
}

  const TABS = [
    { id:'timeline', label:'Itinerary', icon:I('CalendarDays') },
    { id:'map', label:'Map', icon:I('Map') },
    { id:'bookings', label:'Bookings', icon:I('Ticket'), badge: BOOKINGS.filter(b => effStatus(b, status).s === 'action').length },
    { id:'hotels', label:'Hotels', icon:I('BedDouble') },
    { id:'food', label:'Food', icon:I('UtensilsCrossed') },
    { id:'utilities', label:'Utilities', icon:I('Wrench') },
  ];
  let body;
  if (tab === 'bookings') body = html`<${Bookings} status=${status} setStatus=${setStatus} />`;
  else if (tab === 'hotels') body = html`<${Hotels} toast=${toast} />`;
  else if (tab === 'map') body = html`<${MapTab} toast=${toast} />`;
  else if (tab === 'food') body = html`<${Food} toast=${toast} />`;
  else if (tab === 'utilities') body = html`<${Utilities} done=${done} notes=${notes} status=${status} toast=${toast} onReset=${reset} edited=${!!itin} onRestore=${restoreItin} pack=${pack} setPack=${setPack} spend=${spend} setSpend=${setSpend} />`;
  else body = html`<${Timeline} done=${done} toggleDone=${toggleDone} notes=${notes} setNotes=${setNotes} toast=${toast} editItin=${editItin} cityF=${cityF} setCityF=${setCityF} />`;

  return html`<${MotionConfig} reducedMotion="user">
    <div class="wrap">
      <${Header} doneCount=${doneCount} total=${ALL_ACTS.length} onTheme=${flipTheme} dark=${theme === 'dark'} compact=${tab !== 'timeline'} cityF=${cityF} onCity=${pickCity} />
      <${AnimatePresence} mode="wait" initial=${false}>
        <${motion.main} key=${tab} initial=${{ opacity:0, y:8 }} animate=${{ opacity:1, y:0 }} exit=${{ opacity:0, y:-6 }} transition=${{ duration:.2 }}>${body}<//>
      <//>
    </div>
    <nav class="nav" aria-label="Sections">
      <div class="flex" style=${{ maxWidth:720, margin:'0 auto' }}>
        ${TABS.map(t => html`<button key=${t.id} onClick=${() => setTab(t.id)} aria-current=${tab === t.id ? 'page' : undefined}>
          ${tab === t.id && html`<${motion.span} layoutId="pip" className="pip" transition=${{ type:'spring', stiffness:500, damping:38 }} />`}
          <span class="relative inline-flex"><${t.icon} size=${21} strokeWidth=${tab === t.id ? 2.2 : 1.8} />
            ${t.badge > 0 && html`<span style=${{ position:'absolute', top:-4, right:-8, minWidth:16, height:16, padding:'0 4px', borderRadius:8, background:'var(--momiji)', color:'#fff', fontSize:10, fontWeight:700, display:'grid', placeItems:'center' }}>${t.badge}</span>`}
          </span>
          <span style=${{ maxWidth:'100%', overflow:'hidden', textOverflow:'ellipsis' }}>${t.label}</span>
        </button>`)}
      </div>
    </nav>
    <${Toast} msg=${msg} />
  <//>`;
}

RD.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</body>
</html>
